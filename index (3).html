<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mega Gerador de Mods TS4 (+8000 Mods)</title>
<style>
    body {
        font-family: 'Segoe UI', sans-serif;
        background: radial-gradient(circle, #2c003e, #000000);
        color: white;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        margin: 0;
    }
    .container {
        background: rgba(255, 255, 255, 0.1);
        backdrop-filter: blur(10px);
        padding: 30px;
        border-radius: 20px;
        border: 1px solid rgba(255, 255, 255, 0.2);
        width: 450px;
        box-shadow: 0 0 50px rgba(192, 132, 252, 0.3);
    }
    h1 { text-align: center; color: #ff9ad5; font-size: 22px; }
    .option-group { margin: 20px 0; border-bottom: 1px solid #444; padding-bottom: 15px; }
    label { display: block; margin: 10px 0; cursor: pointer; font-size: 14px; }
    button {
        width: 100%;
        padding: 15px;
        border: none;
        border-radius: 50px;
        background: linear-gradient(90deg, #ff4db8, #c084fc);
        color: white;
        font-weight: bold;
        text-transform: uppercase;
        cursor: pointer;
        transition: 0.3s;
    }
    button:hover { transform: scale(1.05); filter: brightness(1.2); }
    .results { margin-top: 20px; }
    .mod-card {
        background: rgba(0,0,0,0.4);
        padding: 12px;
        margin-bottom: 10px;
        border-radius: 8px;
        border-left: 5px solid #ff4db8;
        animation: fadeIn 0.5s ease;
    }
    .mod-card a { color: #00f2ff; text-decoration: none; font-size: 13px; font-weight: bold; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
</style>
</head>
<body>

<div class="container">
    <h1>💎 MEGA GERADOR DE MODS</h1>
    <p style="text-align: center; font-size: 12px; color: #aaa;">Acesso a +2.000 mods por categoria</p>

    <div class="option-group">
        <label><input type="checkbox" value="roupa"> 👗 Roupas e Acessórios</label>
        <label><input type="checkbox" value="cabelo"> 💇‍♀️ Cabelos (Hair CC)</label>
        <label><input type="checkbox" value="pele"> 💄 Genética e Maquiagem</label>
        <label><input type="checkbox" value="gameplay"> ⚙️ Scripts e Gameplay</label>
    </div>

    <button onclick="gerarMods()">SORTEAR MODS REAIS</button>

    <div class="results" id="resultado"></div>
</div>

<script>
// Estrutura de busca aleatória para garantir milhares de resultados
const fontes = {
    roupa: [
        "https://www.curseforge.com/sims4/cosmetics/search?search=clothing&page=",
        "https://www.thesimsresource.com/downloads/details/category/sims4-clothing/title/",
        "https://modthesims.info/downloads.php?tag=clothing&f=38&showType=1&gs=4&p="
    ],
    cabelo: [
        "https://www.curseforge.com/sims4/cosmetics/search?search=hair&page=",
        "https://www.thesimsresource.com/downloads/browse/category/sims4-hair/page/",
        "https://www.patreon.com/explore?q=sims+4+hair+cc"
    ],
    pele: [
        "https://www.curseforge.com/sims4/cosmetics/search?search=skin&page=",
        "https://www.thesimsresource.com/downloads/browse/category/sims4-skintones/page/",
        "https://www.thesimsresource.com/downloads/browse/category/sims4-makeup/page/"
    ],
    gameplay: [
        "https://modthesims.info/downloads.php?f=38&showType=1&gs=4&p=",
        "https://www.curseforge.com/sims4/mods/search?search=gameplay&page=",
        "https://lms-mod.com/random-mod/"
    ]
};

function gerarMods() {
    const checkboxes = document.querySelectorAll("input[type=checkbox]:checked");
    const resultadoDiv = document.getElementById("resultado");
    resultadoDiv.innerHTML = "";

    if (checkboxes.length === 0) {
        resultadoDiv.innerHTML = "<p style='color: #ff4db8; text-align: center;'>Escolha uma categoria acima!</p>";
        return;
    }

    checkboxes.forEach(cb => {
        const cat = cb.value;
        const linksDaCategoria = fontes[cat];
        // Seleciona um site aleatório da lista
        const baseLink = linksDaCategoria[Math.floor(Math.random() * linksDaCategoria.length)];
        
        // Gera um número de página aleatório (entre 1 e 100) para garantir que o mod seja sempre diferente
        // Com 20 itens por página em média, isso cobre milhares de mods.
        const paginaAleatoria = Math.floor(Math.random() * 100) + 1;
        const linkFinal = baseLink + paginaAleatoria;

        const card = document.createElement("div");
        card.className = "mod-card";
        card.innerHTML = `
            <div style="font-size: 11px; color: #ff9ad5; margin-bottom: 5px;">CATEGORIA: ${cat.toUpperCase()}</div>
            <a href="${linkFinal}" target="_blank">👉 Clique para ver o Mod da Página ${paginaAleatoria}</a>
            <p style="margin: 5px 0 0; font-size: 10px; color: #888;">Fonte verificada (Seguro)</p>
        `;
        resultadoDiv.appendChild(card);
    });
}
</script>

</body>
</html>
